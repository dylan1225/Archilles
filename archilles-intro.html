<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archilles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1EADB;--page:#F7F3EA;--ink:#26211C;--body:#4A4038;--org:#B8431A}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,system-ui,sans-serif}

/* ---- the site behind the intro (replace with your own) ---- */
header{height:76px;display:flex;align-items:center;justify-content:flex-end;gap:28px;padding:0 56px;border-bottom:1px solid #DDD3BF}
header a{color:var(--body);text-decoration:none;font-size:15px}
header a:hover,header a:focus-visible{color:var(--ink);text-decoration:underline}
main{max-width:760px;margin:12vh 0 0 56px;padding-right:24px}
h1{font:500 clamp(40px,6vw,68px)/1.05 Fraunces,Georgia,serif;letter-spacing:-.02em;margin:0 0 24px}
main p{font-size:19px;line-height:1.6;color:var(--body);max-width:56ch;margin:0 0 32px}
.cta{display:inline-block;background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:4px;text-decoration:none;font-weight:500}

/* ---- intro ---- */
.veil{position:fixed;inset:0;background:var(--bg);z-index:10;cursor:pointer;transition:opacity .9s ease .15s}
.veil.gone{opacity:0;pointer-events:none}
.veil small{position:absolute;bottom:28px;left:0;right:0;text-align:center;font-size:14px;color:#6B5F52}

#brand{position:fixed;z-index:20;left:68px;top:20px;display:flex;align-items:baseline;
  font:500 34px/1 Fraunces,Georgia,serif;letter-spacing:-.02em;color:var(--ink);text-decoration:none;
  transform-origin:0 0;visibility:hidden;will-change:transform}
#glyph{display:inline-block;height:.72em;width:.617em;margin-right:.03em;overflow:visible}
.ch{display:inline-block;opacity:0}

.leg,.key{fill:none;stroke:var(--ink);stroke-width:16}
.leg{stroke-dasharray:100;stroke-dashoffset:100}
.key,.fly,.trail{opacity:0}
.quiver{transform-box:view-box;transform-origin:14px 132px}
.arrow,.trail{fill:none;stroke:var(--org);stroke-linecap:round}
.trail{stroke-width:1.6}
.head{fill:var(--org)}
.heel{fill:var(--org);opacity:0}
.ring{fill:none;stroke:var(--org);stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}

/* timeline: legs rise 0.2-2.1s, keystone drops 2.15s, arrow flies 3.0s and lands 3.22s,
   letters type in from 3.7s (0.09s apart), dock at 5.3s */
#brand{--t0:3.7s}
.go .leg{animation:build 1.9s cubic-bezier(.45,0,.25,1) .2s forwards}
.go .key{animation:drop .55s cubic-bezier(.3,1.35,.5,1) 2.15s forwards}
.go .fly{animation:shoot .22s linear 3s forwards}
.go .trail{animation:streak .22s linear 3s forwards}
.go .quiver{animation:quiver .75s ease-in-out 3.22s}
.go .arch{animation:hit .45s linear 3.22s}
.go .heel{animation:flash .7s ease-out 3.22s}
.go .ring{animation:pulse .8s ease-out 3.22s}
.go .ch{animation:type .3s cubic-bezier(.2,.7,.2,1) calc(var(--t0) + var(--i) * .09s) forwards}
@keyframes build{to{stroke-dashoffset:8}}
@keyframes drop{0%{opacity:0;transform:translateY(-90px)}12%{opacity:1}100%{opacity:1;transform:none}}
@keyframes shoot{from{opacity:1;transform:translate(-571px,-185px)}to{opacity:1;transform:none}}
@keyframes streak{0%,90%{opacity:.5}100%{opacity:0}}
@keyframes quiver{0%{transform:none}10%{transform:rotate(-4.5deg)}25%{transform:rotate(3.4deg)}40%{transform:rotate(-2.4deg)}55%{transform:rotate(1.6deg)}70%{transform:rotate(-.9deg)}85%{transform:rotate(.4deg)}100%{transform:none}}
@keyframes hit{0%{transform:none}12%{transform:translate(2.4px,.8px)}30%{transform:translate(-1.5px,-.5px)}50%{transform:translate(1px,.3px)}70%{transform:translate(-.5px,0)}100%{transform:none}}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
@keyframes pulse{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(4.5)}}
@keyframes type{from{opacity:0;transform:translateY(.14em)}to{opacity:1;transform:none}}
.skip #brand *{animation-duration:0s!important;animation-delay:0s!important}

.replay{position:fixed;right:20px;bottom:20px;z-index:30;font:500 14px Inter,sans-serif;padding:10px 14px;border:1px solid var(--ink);background:var(--page);color:var(--ink);border-radius:4px;cursor:pointer}
@media (max-width:600px){header{padding:0 20px}main{margin-left:20px}#brand{left:32px;font-size:28px}}
</style>
</head>
<body>

<a id="brand" href="/" aria-label="Archilles home">
<svg id="glyph" viewBox="0 0 120 140" aria-hidden="true">
<g class="arch">
<path class="leg" pathLength="100" d="M20 140 V58 A40 40 0 0 1 60 18"></path>
<path class="leg" pathLength="100" d="M100 140 V58 A40 40 0 0 0 60 18"></path>
<path class="key" d="M48 19.9 A40 40 0 0 1 72 19.9"></path>
<rect class="heel" x="12" y="122" width="16" height="18"></rect>
<circle class="ring" cx="18" cy="133" r="7"></circle>
<g class="fly"><g class="quiver"><g transform="rotate(18 14 132)">
<path class="trail" d="M-76 132 H-230 M-76 125 H-190 M-76 139 H-205"></path>
<path class="arrow" stroke-width="6" d="M-6 132 H-70"></path>
<polygon class="head" points="14,132 -6,119 -6,145"></polygon>
<path class="arrow" stroke-width="5" d="M-52 132 L-64 120 M-52 132 L-64 144 M-64 132 L-76 120 M-64 132 L-76 144"></path>
</g></g></g>
</g>
</svg><span class="word" aria-hidden="true"><span class="ch" style="--i:0">r</span><span class="ch" style="--i:1">c</span><span class="ch" style="--i:2">h</span><span class="ch" style="--i:3">i</span><span class="ch" style="--i:4">l</span><span class="ch" style="--i:5">l</span><span class="ch" style="--i:6">e</span><span class="ch" style="--i:7">s</span></span>
</a>

<div id="veil" class="veil"><small>Click to skip</small></div>

<header>
<a href="/interiors">Explore building interiors</a>
<a href="#examples">From the collection</a>
</header>
<main>
<h1>Find the weak point before it fails.</h1>
<p>Photograph a broken part and find out how it failed and what to change, or review a scanned interior for early signs of a weakness.</p>
<a class="cta" href="#upload">Analyse a photo</a>
</main>

<button class="replay" id="replay" type="button">Replay intro</button><!-- demo only: delete on your site -->

<script>
(() => {
  const brand = document.getElementById('brand');
  const glyph = document.getElementById('glyph');
  const veil = document.getElementById('veil');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let timer;

  // Put the whole lockup mid-screen at a large size (its CSS position is its real home).
  function centre() {
    brand.style.transition = 'none';
    brand.style.transform = 'none';
    const r = brand.getBoundingClientRect(), g = glyph.getBoundingClientRect();
    const s = Math.min(300 / g.height, innerWidth * 0.78 / r.width);
    const tx = innerWidth / 2 - r.left - s * r.width / 2;
    const ty = innerHeight / 2 - r.top - s * r.height / 2;
    brand.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  }

  // Retreat to the top left and reveal the site.
  function dock() {
    clearTimeout(timer);
    brand.style.transition = reduce ? 'none' : 'transform 1.1s cubic-bezier(.65,0,.25,1)';
    brand.style.transform = 'none';
    brand.classList.add('docked');
    veil.classList.add('gone');
  }

  function play() {
    clearTimeout(timer);
    document.body.classList.remove('skip');
    brand.classList.remove('go', 'docked');
    veil.classList.remove('gone');
    centre();
    brand.style.visibility = 'visible';
    void brand.offsetWidth;            // restart the CSS animations
    brand.classList.add('go');
    timer = setTimeout(dock, 5300);
  }

  function skip() { document.body.classList.add('skip'); dock(); }

  veil.addEventListener('click', skip);
  addEventListener('keydown', () => { if (!veil.classList.contains('gone')) skip(); });
  document.getElementById('replay').addEventListener('click', play);

  if (reduce) {                        // no motion: show the finished logo straight away
    brand.style.visibility = 'visible';
    brand.classList.add('go', 'docked');
    document.body.classList.add('skip');
    veil.classList.add('gone');
  } else {
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(play);
  }
})();
</script>
</body>
</html>
